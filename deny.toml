[graph]
targets = [
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "bzip2-1.0.6",
]

[bans]
# docs/dependency-inventory.md §6 assessed the workspace's two version
# duplications (getrandom 0.2/0.4, windows-sys 0.52/0.61) and found both
# benign. Neither shows up here to skip: getrandom's split is dev-dependency-
# only and cargo-deny's graph excludes dev-deps by default; windows-sys is
# excluded by `[graph].targets` above, since this is a Linux-only target.
multiple-versions = "warn"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
