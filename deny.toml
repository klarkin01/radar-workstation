[graph]
targets = [
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "bzip2-1.0.6",
    # --- Stage 4 render stack (ADR-0022). Added one entry at a time per
    # ADR-0022's process; each names a crate in the winit/wgpu/egui tree
    # that requires it. All permissive; nothing copyleft beyond MPL-2.0
    # appeared (that would have been an ADR-0009 question, not an edit).
    "BSD-2-Clause",       # arrayref (via wgpu-hal), spirv
    "Zlib",               # foldhash (via egui/ahash), tinyvec-macros already MIT
    "OFL-1.1",            # epaint_default_fonts — bundled UI fonts (SIL Open Font License)
    "Ubuntu-font-1.0",    # epaint_default_fonts — bundled Ubuntu font
]

[bans]
# docs/dependency-inventory.md §6 assessed the workspace's two version
# duplications (getrandom 0.2/0.4, windows-sys 0.52/0.61) and found both
# benign. Neither shows up here to skip: getrandom's split is dev-dependency-
# only and cargo-deny's graph excludes dev-deps by default; windows-sys is
# excluded by `[graph].targets` above, since this is a Linux-only target.
multiple-versions = "warn"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
